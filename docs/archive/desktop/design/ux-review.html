function notice(text){const n=document.getElementById('toast');n.textContent=text;n.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.hidden=true,3000)}
function nav(){return `<aside class="rail"><div class="logo">黎</div>${[['运行','play','idle'],['账号','user','accounts'],['策略','sliders','strategy'],['设备','device','devices'],['记录','chart','records'],['设置','settings','settings']].map(([label,i,v])=>`<button class="nav ${v==='idle'&&['idle','running','stopped'].includes(view)||v==='strategy'&&['strategy','ratings'].includes(view)?'active':''}" onclick="${viewNames[v]?`go('${v}')`:`openInfo('${v}')`}">${icon(i)}<span>${label}</span></button>`).join('')}<div class="grow"></div><div class="prototype">设计预览<br>示例数据<br><span class="num">desktop.2</span></div></aside>`}
function renderTop(){const idle=view==='idle';return `<header class="top"><button class="chip" onclick="openInfo('devices')"><span class="dot ${idle?'warn':'ok'}"></span><b>${idle?'未连接模拟器':'MuMu 12'}</b><span class="address">${idle?'连接后读取设备信息':'127.0.0.1:16384 · 1920×1080 · MaaTouch'}</span>${icon('chevron')}</button><button class="chip" onclick="openInfo('accounts')"><span class="muted">账号</span><b>${idle?'未选择':'示例主号 · 国服 Bilibili'}</b>${icon('chevron')}</button><span class="grow"></span><span class="badge ${view==='running'?'primary':view==='stopped'?'err':'primary'}"><span class="dot"></span>${view==='running'?(paused?'已暂停':'批量执行中'):view==='stopped'?'异常停止':'空闲'}</span><button class="iconbtn" aria-label="切换浅色与深色" title="切换浅色与深色" onclick="toggleTheme()">${icon(theme==='light'?'moon':'sun')}</button></header>`}
function readiness(){const idle=view==='idle';return `<section class="card"><div class="card-title"><h3>就绪检查</h3><button class="link" onclick="notice('设计演示：实现时仅在主动检查和开始前查询前台')">重新检查</button></div>${[
['模拟器已连接',idle?'去连接':'MuMu 12',idle],['分辨率与触控',idle?'等待连接':'1920×1080',idle],['游戏在前台',idle?'待检查':'上次检查通过',idle],['账号凭据',idle?'去添加':'已保存',idle],['国服数据库','已就绪',false],['识别模型','已加载',false]].map(([label,value,missing],i)=>`<div class="check"><span class="check-icon ${missing?'missing':''}">${missing?'–':'✓'}</span><span>${label}</span>${missing&&[0,3].includes(i)?`<button class="link fix" onclick="openInfo('${i===0?'devices':'accounts'}')">${value} →</button>`:`<span class="check-value">${value}</span>`}</div>`).join('')}<div class="check"><span class="check-icon warn">!</span><label for="animation-confirm">关闭“播放角色加入动画”<br><span class="muted">请在游戏内确认</span></label><input class="confirm" id="animation-confirm" type="checkbox" aria-label="确认已关闭播放角色加入动画" onchange="notice('设计演示：动画设置由用户确认，始终保留提醒')"></div></section>`}
function taskCard(){return `<section class="card"><div class="card-title"><h3>任务</h3><span class="muted small">单设备 · 单任务</span></div><div class="task-grid">${Object.entries(taskNames).map(([key,[name,desc,type]])=>`<button class="task ${selectedTask===key?'selected':''} ${key==='entry'?'wide':''}" aria-pressed="${selectedTask===key}" onclick="selectTask('${key}')"><strong>${name}</strong><span class="desc" title="${type} · ${desc}">${({batch:"会点击 · 连续执行",reroll:"网络 · 刷至满意",read:"只读 · 登录读取",recognition:"只读 · 不点击",entry:"会点击 · 按当前策略操作游戏"})[key]}</span></button>`).join('')}</div><div class="small muted" style="margin:12px 0;line-height:1.9"><p>难度 <b class="num" style="color:var(--ink)">5</b> · ${view==='idle'?'尚未配置目标':'5 个公会 · 共 15 次'}</p><p title="首轮复用已验证开局；策略全部账号共用">复用已验证开局 · 策略修改 <b class="num">3</b> 项</p></div><button class="btn block" onclick="openInfo('config')">编辑完整配置 ${icon('arrow')}</button></section>`}

function routeCard(){const roles=UX_SAMPLE_ROLES.slice(0,4);return `<section class="card"><div class="card-title"><h3>本区域进度</h3><span class="section-meta">区域 <b class="num">3</b> · 节点 <b class="num">7 / 12</b></span></div><div class="route">${Array.from({length:12},(_,i)=>`${i?`<span class="edge ${i<7?'visited':''}"></span>`:''}<span class="node ${i<6?'visited':i===6?'current':''}" title="${i<6?'已访问':i===6?'当前位置':'未访问'}"></span>`).join('')}</div><p class="muted small">下一节点：商店 · 普通战斗 · 第 1 队</p><div class="roster-relic"><div><div class="small muted">已加入角色 · 8</div><div class="avatars">${roles.map(r=>`<img class="avatar" src="${roleAsset(r)}" alt="${r.name}" title="${r.name}">`).join('')}<span class="avatar-more">+4</span></div></div><div><div class="small muted">已识别遗物 · 6</div><div class="relics"><span class="relic">示例遗物 A</span><span class="relic">示例遗物 B</span><span class="relic">+4</span></div></div></div></section>`}
function goals(){return `<section class="card"><div class="card-title"><h3>批量目标</h3><span class="section-meta">按通关计</span></div>${['美食殿堂','破晓之星','咲恋救济院','王宫骑士团','拉比林斯'].map((g,i)=>`<div class="goal ${i===0?'done':i===1?'current':''}"><span>${g}</span><div class="bar"><span style="width:${i===0?100:0}%"></span></div><span class="count num">${i===0?3:0}/3</span></div>`).join('')}<div class="stats"><div class="stat"><strong class="num">4</strong><span>已开始</span></div><div class="stat"><strong class="num">3</strong><span>已通关</span></div><div class="stat"><strong class="num">0</strong><span>异常</span></div></div></section>`}
function stopped(){return `<section class="card alert"><div class="alert-head"><span class="alert-mark">${icon('warning')}</span><div><h2>本次执行已停止</h2><p>识别到了战斗失败页，但没有当前战斗信息。</p></div></div><div class="next-step"><b>建议先进入游戏主界面</b>可能停在了标题画面。确认游戏已进入主界面后，重新使用只读识别检查画面。</div><div class="row"><button class="btn primary" onclick="selectedTask='recognition';go('idle');notice('设计演示：已选择只读识别，未启动任何任务')">切换到只读识别</button><button class="btn" onclick="openInfo('records')">查看记录</button></div><details><summary>详情 · 查看原始停止原因</summary><div class="raw-reason"><p>示例来源：FATAL_RUN</p><p>原始消息：已识别战斗失败页，但缺少本次战斗上下文；未自动点击结束或重新挑战</p><button class="link" onclick="navigator.clipboard?.writeText('FATAL_RUN：已识别战斗失败页，但缺少本次战斗上下文；未自动点击结束或重新挑战');notice('已复制设计示例的原始原因')">复制详情</button></div></details></section>`}
function middle(){if(view==='idle')return `<div class="stack column"><section class="card idle-welcome"><div class="welcome-mark">${icon('play')}</div><h1>从这里开始今天的任务</h1><p>先连接模拟器、选择账号。<br>左侧会列出还需要完成的准备。</p><button class="btn primary" onclick="openInfo('devices')">连接模拟器 ${icon('arrow')}</button></section><section class="card"><div class="card-title"><h3>上次运行</h3><button class="link" onclick="openInfo('records')">全部记录 →</button></div><div class="empty">${icon('history')}<h3>还没有运行记录</h3><p>第一次任务结束后，这里会显示结果和停止原因。</p></div></section><div class="hint">首次使用，可以先选“只读识别”检查游戏画面。</div></div>`;return `<div class="stack column">${hero()}${view==='stopped'?stopped():routeCard()}${goals()}${view==='running'?`<div class="decision"><b>最近决策</b><p>角色奖励：选择亚里莎 · 评分 <span class="num">78</span></p></div>`:''}</div>`}
const sampleLogs=[['21:42:18','key','进入','商店页面'],['21:42:11','normal','','战斗结束，返回地图','×2'],['21:38:02','key','选择','角色奖励：亚里莎'],['21:37:40','normal','','编组完成：第 1 队'],['21:35:12','warning','提醒','截图超时，已恢复'],['21:29:54','key','完成','美食殿堂 第 3/3 次 · 通关'],['21:29:50','key','开始','破晓之星 第 1/3 次'],['21:16:40','normal','','开局校验通过']];
function logRows(){const query=(document.getElementById('log-query')?.value||'').toLowerCase(),rows=view==='idle'?[]:view==='stopped'?[['21:42:18','error','停止','缺少战斗上下文，请检查游戏画面'],...sampleLogs]:sampleLogs;return rows.filter(r=>(logFilter==='all'||logFilter==='key'&&r[1]!=='normal'||logFilter==='warning'&&['warning','error'].includes(r[1]))&&r.join(' ').toLowerCase().includes(query)).map(r=>`<div class="log"><time class="num">${r[0]}</time><span><b class="${r[1]==='warning'?'warn':r[1]==='error'?'err':r[1]==='key'?'ok':''}">${r[2]}</b> ${r[3]} ${r[4]?`<span class="repeat">${r[4]}</span>`:''}</span></div>`).join('')||`<div class="empty">${icon('chart')}<h3>${view==='idle'?'等待第一条任务日志':'没有匹配的日志'}</h3><p>${view==='idle'?'开始后，关键事件会出现在这里。':'试试“全部”或其他关键词。'}</p><button class="link" onclick="${view==='idle'?`notice('设计演示：准备就绪后，点击底部开始')`:`logFilter='all';render()`}">${view==='idle'?'查看开始提示':'显示全部日志'}</button></div>`}
function updateLogs(){document.getElementById('log-rows').innerHTML=logRows()}
function right(){const idle=view==='idle';return `<div class="stack right-column"><div class="right-tabs" role="tablist" aria-label="画面与日志">${['preview','logs'].map((t,i)=>`<button role="tab" aria-selected="${rightTab===t}" class="${rightTab===t?'active':''}" onclick="rightTab='${t}';render()">${i?'日志':'画面'}</button>`).join('')}</div><section class="card preview-card" data-hidden="${rightTab!=='preview'}"><div class="card-title"><h3>实时画面</h3><button class="link" onclick="notice('设计演示：空闲时默认收起，运行时默认展开')">${idle?'展开':'收起'}</button></div>${idle?`<div class="hint">连接模拟器后可展开预览。<button class="link" onclick="openInfo('devices')">去连接 →</button></div>`:`<div class="preview"><div class="sample">${icon('image')}<span>画面占位 · 未连接模拟器</span><span style="opacity:.65">设计稿不展示伪造的游戏画面</span></div></div><div class="preview-meta"><span>商店 · 置信度 <b class="num">0.92</b></span><span class="num">≤2 fps</span></div><p class="preview-metrics">帧 <b class="num">8,214</b>　动作 <b class="num">132</b>　上一步 <b>点击购买</b></p>`}</section><section class="card log-card" data-hidden="${rightTab!=='logs'}"><div class="card-title"><h3>日志</h3><button class="link" onclick="navigator.clipboard?.writeText(sampleLogs.map(r=>r.join(' ')).join('\n'));notice('已复制设计示例日志')">复制全部</button></div><div class="segments">${[['key','关键'],['all','全部'],['warning','警告与错误']].map(([k,v])=>`<button class="${logFilter===k?'active':''}" onclick="logFilter='${k}';render()">${v}</button>`).join('')}</div><label class="search">${icon('search')}<input id="log-query" aria-label="搜索日志" placeholder="搜索日志                     Ctrl+F" oninput="updateLogs()"></label><div id="log-rows" class="logs">${logRows()}</div></section></div>`}
function strategy(){return `<div class="page"><div class="page-heading"><div><h1>策略</h1><p>所有账号共用 · 保存后从下一次任务启动生效</p></div><button class="btn" onclick="notice('设计演示：正式版保留上游恢复默认的确认')">恢复默认</button></div><div class="tabs"><button class="active" onclick="go('strategy')">全局策略</button><button onclick="openInfo('roster')">开局编组</button><button onclick="go('ratings')">角色评分 <span class="badge primary">3</span></button></div><div class="strategy-form"><div class="form-scroll"><details class="section" open><summary><b>评分</b><small>玩家评分 70% · 系统权重自动归一化 ▴</small></summary><div class="section-content"><button class="btn block" onclick="go('ratings')">角色头像与个人评分 · 已修改 3 人 ${icon('arrow')}</button><p class="info">玩家评分缺失时仍按原规则降低有效权重。以下系统项目是相对权重，无需手动凑到 100。</p>${[['玩家评分占比',70],['系统：伤害',50],['系统：生存',23],['系统：功能',13],['系统：阵型',4],['系统：协同',10]].map(([label,n])=>`<label class="weight-row"><span>${label}</span><input type="range" min="0" max="100" value="${n}" oninput="this.nextElementSibling.textContent=this.value;document.getElementById('strategy-state').textContent='设计演示：有未保存的修改'"><span class="num">${n}</span></label>`).join('')}<label class="filter-check"><input type="checkbox" checked>属性配对增伤</label><p class="info">关闭后角色属性仍会识别，并继续用于筛选 / 显示。</p></div></details>${[['选人部署','第一队 100% · 第二队 35% · 第三队 20%'],['Boss 编组','多队编组'],['战斗失败处理','按已保存规则处理'],['开局阵容','5 个公会 · 内置方案'],['遗物与商店','优先级与刷新条件'],['事件与响应','响应间隔 300 ms'],['特别装备','关闭']].map(([name,desc])=>`<details class="section"><summary><b>${name}</b><small>${desc} ▾</small></summary><div class="section-content"><p class="info">此处表示现有上游表单分组的位置，完整字段、默认值、范围与校验在正式实现中原样复用。</p></div></details>`).join('')}</div><div class="savebar"><div><strong id="strategy-state">有未保存的修改 · 设计示例</strong><p>保存后从下一次任务启动生效</p></div><span class="grow"></span><button class="btn" onclick="notice('设计演示：取消仍由上游处理未保存修改确认')">取消</button><button class="btn primary" onclick="notice('设计演示：未写入任何真实策略')">保存配置</button></div></div></div>`}
function ratingRows(){const q=document.getElementById('role-query')?.value.toLowerCase()||'',attribute=document.getElementById('attribute')?.value||'',job=document.getElementById('role-job')?.value||'',modified=document.getElementById('modified-only')?.checked||false,sort=document.getElementById('role-sort')?.value||'modified';let roles=UX_SAMPLE_ROLES.filter(r=>(!q||[r.name,r.id].join(' ').toLowerCase().includes(q))&&(!attribute||r.attribute===attribute)&&(!job||r.job===job)&&(!modified||draftPersonal[r.id]!==undefined));roles.sort((a,b)=>sort==='modified'?(Number(draftPersonal[b.id]!==undefined)-Number(draftPersonal[a.id]!==undefined)||Number(a.id)-Number(b.id)):sort==='score'?(b.score??-1)-(a.score??-1):sort==='name'?a.name.localeCompare(b.name,'zh'):Number(a.id)-Number(b.id));return roles.map(r=>`<tr data-role-id="${r.id}"><td><div class="role-cell"><img src="${roleAsset(r)}" alt=""><strong>${r.name}</strong></div></td><td>${r.attribute||'—'}</td><td>${r.job||'—'}</td><td class="num muted">${r.id}</td><td class="num">${r.score??'暂无'}</td><td><input class="score-field ${draftPersonal[r.id]!==undefined?'modified':''}" data-id="${r.id}" aria-label="${r.name}的我的评分" type="text" inputmode="numeric" pattern="([0-9]{1,2}|100)" maxlength="3" value="${draftPersonal[r.id]??''}" placeholder="沿用" oninput="validateScore(this)" onkeydown="scoreKey(event,this)"></td><td><button class="link" onclick="restoreRole('${r.id}')" ${draftPersonal[r.id]===undefined?'disabled':''}>恢复原评分</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><h3>没有符合条件的角色</h3><button class="link" onclick="go(\'ratings\')">清除筛选</button></div></td></tr>'}
function validateScore(input){input.value=input.value.replace(/[^0-9]/g,'').slice(0,3);const valid=/^\d{1,3}$/.test(input.value)&&Number(input.value)<=100;input.setAttribute('aria-invalid',String(!valid));document.getElementById('rating-state').textContent=valid?'设计演示：按 Enter 应用到草稿':'请输入 0–100 的整数；空值不提交';}
function scoreKey(event,input){const fields=[...document.querySelectorAll('.score-field')],index=fields.indexOf(input);if(['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();fields[index+(event.key==='ArrowDown'?1:-1)]?.focus();return}if(event.key==='Enter'&&/^\d{1,3}$/.test(input.value)&&Number(input.value)<=100){draftPersonal[input.dataset.id]=Number(input.value);input.classList.add('modified');document.getElementById('rating-state').textContent='已应用到草稿；返回策略设置后点击「保存配置」。';input.closest('tr').querySelector('button').disabled=false}}
function restoreRole(id){delete draftPersonal[id];updateRoles();document.getElementById('rating-state').textContent='已恢复此角色原评分；尚未保存策略。'}
function updateRoles(){document.getElementById('rating-rows').innerHTML=ratingRows()}
function ratings(){const attrs=[...new Set(UX_SAMPLE_ROLES.map(r=>r.attribute).filter(Boolean))],jobs=[...new Set(UX_SAMPLE_ROLES.map(r=>r.job).filter(Boolean))];return `<div class="page ratings-page"><div class="page-heading"><div><h1>角色个人评分</h1><p>个人评分优先用于选人和编组。不会补全缺失角色资料或覆盖数据库。</p></div><button class="btn" onclick="openInfo('original')">使用原版表单</button></div><div class="tabs"><button onclick="go('strategy')">全局策略</button><button onclick="openInfo('roster')">开局编组</button><button class="active">角色评分</button></div><div class="ratings-tools"><label class="search">${icon('search')}<input id="role-query" aria-label="搜索角色" placeholder="搜索角色名、版本或 ID" oninput="updateRoles()"></label><select id="attribute" aria-label="按属性筛选" onchange="updateRoles()"><option value="">全部属性</option>${attrs.map(a=>`<option>${a}</option>`).join('')}</select><select id="role-job" aria-label="按定位筛选" onchange="updateRoles()"><option value="">全部定位</option>${jobs.map(a=>`<option>${a}</option>`).join('')}</select><label class="filter-check"><input id="modified-only" type="checkbox" onchange="updateRoles()">仅看已修改</label><span class="grow"></span><select id="role-sort" aria-label="角色排序" onchange="updateRoles()"><option value="modified">已修改优先</option><option value="id">ID 升序</option><option value="score">原评分降序</option><option value="name">名称排序</option></select></div><div class="table-card"><table><thead><tr><th>角色</th><th>属性</th><th>定位</th><th>ID</th><th>原评分</th><th>我的评分 · 0–100</th><th>操作</th></tr></thead><tbody id="rating-rows">${ratingRows()}</tbody></table></div><div class="table-bottom"><span>展示 ${UX_SAMPLE_ROLES.length} 名目录样例 · 真实头像与角色资料，个人评分为示例</span><span>↑ ↓ 移动　Enter 应用到草稿</span></div><div class="savebar"><div><strong id="rating-state">此页修改先加入草稿。</strong><p>返回策略设置后点击「保存配置」。</p></div><span class="grow"></span><button class="btn primary" onclick="go('strategy')">返回策略设置</button></div></div>`}
function footer(){const work=view==='running',idle=view==='idle',edit=['strategy','ratings'].includes(view);return `<footer class="footer"><div class="summary grow"><strong><span class="dot ${view==='stopped'?'err':work?'ok':'warn'}"></span>${work?(paused?'任务已暂停':'正在执行：破晓之星 第 1/3 次'):view==='stopped'?'已停止 · 请检查游戏画面':edit?'当前没有运行中的任务':'准备开始'}</strong><p>${work?'区域 3 · 节点 7/12 · 已运行 42 分钟':view==='stopped'?'查看停止原因后，再决定下一步操作':edit?'策略修改从下次任务启动生效':'选择任务，完成左侧就绪检查'}</p></div>${idle?`<button class="gating" onclick="openInfo('devices')">还差：模拟器未连接 →</button>`:''}<div class="actions">${work?`<button class="btn" onclick="paused=!paused;render()">${icon(paused?'play':'pause')}${paused?'继续':'暂停'} <kbd>F6</kbd></button>`:''}<button class="btn danger" ${!work?'disabled title="当前没有运行中的任务"':''} onclick="go('stopped')">${icon('stop')}停止 <kbd>F7</kbd></button><button class="btn primary" ${idle||work||edit?'disabled title="'+(work?'当前任务正在运行':edit?'先返回运行台选择任务':'请先连接模拟器')+'"':''} onclick="go('running')">${icon('play')}开始 <kbd>F5</kbd></button></div></footer>`}
const info={devices:['设备','连接模拟器','正式版在此展示检测到的模拟器列表，支持一键连接。手动地址和 ADB 路径收进“高级”。本设计预览不检测或连接设备。'],accounts:['账号','选择当前账号','正式版保留当前、缺凭据、UID 未填的状态徽标。任务忙碌时禁止切换，并解释原因。本设计预览不接收真实账号或凭据。'],records:['运行记录','运行记录与日志诊断','正式版记录开始时间、账号别名、任务类型、结果、耗时及原始停止原因，并展示近 14 天通关次数与平均用时。当前预览没有真实运行记录。'],settings:['设置','外观与偏好','正式版提供浅色、深色、跟随系统、标准与大字号，以及通知选项。当前可通过顶栏切换浅色和深色设计稿。'],config:['完整任务配置','右侧大抽屉承载上游完整表单','正式版原样嵌入 LabyrinthScreen，保留登录读取、目标次数、按通关 / 次数计、刷取条件、难度、路线、Boss 和必要确认。此处仅表示抽屉尺寸和返回位置。'],roster:['开局编组','继续使用上游编组编辑器','保留 5 个公会、3 个槽位、候选顺序与校验。只调整主题和外层，不重写内部草稿。'],original:['原版角色评分','保留随时切回的入口','设置中提供“使用原版表单”，直接打开现有上游角色评分页，保留相同的 0–100 与恢复原评分语义。']};
function openInfo(key){const [title,heading,body]=info[key];const div=document.createElement('div');div.className='dialog-backdrop';div.id='drawer';div.innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="row"><h2 id="drawer-title">${title}</h2><span class="grow"></span><button class="iconbtn" aria-label="关闭抽屉" onclick="closeDrawer()">${icon('close')}</button></div><div class="scope-note">检查点 A · 交互示意。本页不执行真实操作。</div><div class="content"><h2>${heading}</h2><p class="muted" style="margin:14px 0 22px">${body}</p>${key==='config'?'<div class="sample-field">第 1 步 · 登录账号并读取当前开局</div><div class="sample-field">第 2 步 · 公会目标与目标模式</div><div class="sample-field">完整刷开局条件、路线与 Boss 配置</div><p class="small muted">不在设计稿中重写业务表单。</p>':''}</div><span class="grow"></span><button class="btn" onclick="closeDrawer()">返回${['strategy','ratings'].includes(view)?'策略':'运行台'}</button></section>`;document.querySelector('.workspace').appendChild(div);div.querySelector('button').focus()}
function closeDrawer(){document.getElementById('drawer')?.remove()}
function render(){document.getElementById('review-views').innerHTML=Object.entries(viewNames).map(([key,label])=>`<button aria-current="${view===key}" onclick="go('${key}')">${label}</button>`).join('');document.getElementById('app').innerHTML=nav()+renderTop()+`<main class="workspace">${['strategy','ratings'].includes(view)?(view==='strategy'?strategy():ratings()):`<div class="console"><div class="stack column">${readiness()}${taskCard()}</div>${middle()}${right()}</div>`}</main>`+footer()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();return}if(e.ctrlKey&&e.key.toLowerCase()==='f'&&document.getElementById('log-query')){e.preventDefault();document.getElementById('log-query').focus()}if(e.target.matches('input,select,textarea'))return;if(e.key==='F5'){e.preventDefault();notice('设计预览：不启动真实任务')}if(e.key==='F6'&&view==='running'){e.preventDefault();paused=!paused;render()}if(e.key==='F7'&&view==='running'){e.preventDefault();go('stopped')}});
render();
</script>
</body>
</html>
