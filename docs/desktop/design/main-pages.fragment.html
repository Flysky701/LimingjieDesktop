<script>
(() => {
'use strict';
const root=document.getElementById('lj-app'), $=s=>root.querySelector(s);
const names={home:'黎明界',accounts:'账号库',strategy:'策略设置',device:'设备',settings:'设置与环境',diagnostics:'诊断'};
const categories={score:'评分权重',selection:'选人策略',boss:'Boss 编组',relic:'遗物策略',shop:'商店',events:'事件',speed:'响应速度'};
// Original defaults: wbero/limingjie-assistant, b809b196, LabyrinthStrategySettings.kt.
const defaults={playerWeight:70,damageWeight:50,survivalWeight:23,functionWeight:13,formationWeight:4,cohesionWeight:10,attributePairingBonusEnabled:true,mixedDamagePenalty:15,effectiveCharacterSystemBonus:8,secondTeamWeight:35,thirdTeamWeight:20,duplicateRolePenalty:8,bossTeamMode:'MULTI_TEAM',preferPureBossDamageSystem:true,singleBossFallbackToMultiAfterThreeFailures:true,singleBossRetryCountBeforeMulti:2,rerollAfterThreeBattleFailures:true,baselineTarget:4,baselineLastArea:3,debuffPivotMinimum:12,debuffPivotTolerance:2,buyRelics:true,refreshShop:true,refreshFromArea:5,normalWinRate:95,extremeWinRate:70,responseIntervalMillis:300};
const state={page:'home',category:'score',accent:'#6952d5',mode:'auto',status:'idle',connected:true,selected:1,current:1,retire:false,forever:true,reuse:true,notice:'',saved:{...defaults},draft:{...defaults},accounts:[{id:1,name:'主账号',server:'B 服',login:'demo_main'},{id:2,name:'探索账号',server:'小米服',login:'demo_1024'},{id:3,name:'备用账号',server:'B 服',login:'demo_backup'}],logs:[['09:41:02','已连接 MuMu 12'],['09:41:03','截图与触控服务就绪'],['09:41:03','已载入主账号的本地配置'],['09:41:04','准备就绪，等待开始任务']]};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(text,action,primary=false,disabled=false)=>`<button type="button" class="lj-button ${primary?'lj-primary':''} cursor-interaction" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
const link=(text,action)=>`<button type="button" class="lj-textbutton cursor-interaction" data-action="${action}">${text}${icon('chevron-right')}</button>`;
const current=()=>state.accounts.find(a=>a.id===state.current);
const active=()=>state.status!=='idle';
const dirty=()=>JSON.stringify(state.saved)!==JSON.stringify(state.draft);
const modeName=()=>({auto:'画面自动化',reroll:'刷开局',recognize:'只读识别'}[state.mode]);
const heading=(title,sub,action='')=>`<div class="lj-heading"><div><div class="lj-kicker">LIMINGJIE / ${state.page==='home'?'WORKSPACE':state.page.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;
const pair=(label,value)=>`<div class="lj-pair"><span>${label}</span><b>${value}</b></div>`;
const note=text=>`<div class="lj-note">${icon('info')}<span>${text}</span></div>`;
const check=(label,key,description='',isTask=false)=>`<label class="lj-check"><input type="checkbox" ${isTask?'data-task':'data-setting'}="${key}" ${(isTask?state[key]:state.draft[key])?'checked':''} ${isTask&&active()?'disabled':''}><span>${label}${description?`<small>${description}</small>`:''}</span></label>`;
const number=(label,key,min,max,suffix='')=>`<label class="lj-field"><span>${label}${suffix?`<small>${suffix}</small>`:''}</span><input class="lj-input" type="number" min="${min}" max="${max}" step="1" data-setting="${key}" value="${state.draft[key]}" required></label>`;
const select=(label,key,options)=>`<label class="lj-field"><span>${label}</span><select data-setting="${key}">${options.map(([v,t])=>`<option value="${v}" ${String(state.draft[key])===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;
function persist(){try{window.openai?.setWidgetState({modelContent:{page:names[state.page],theme:state.accent},privateContent:{page:state.page,category:state.category,accent:state.accent}})?.catch(()=>{});}catch{}}
function restore(snapshot){const p=snapshot?.privateContent;if(!p)return;if(names[p.page])state.page=p.page;if(categories[p.category])state.category=p.category;if(/^#[a-f\d]{6}$/i.test(p.accent||''))state.accent=p.accent;}
restore(window.openai?.widgetState);
function addLog(message){state.logs.push([new Date().toLocaleTimeString('zh-CN',{hour12:false}),message]);state.logs=state.logs.slice(-6);}
function announce(text){state.notice=text;$('#lj-notice').textContent=text;$('#lj-notice').hidden=!text;}
let dialogAction=null;
function dialog(title,content,confirm,callback){$('#lj-dialog').innerHTML=`<h2 id="lj-dialog-title">${title}</h2>${content}<div class="lj-actions">${button(confirm?'取消':'关闭','dialog-cancel')}${confirm?button(confirm,'dialog-confirm',true):''}</div>`;dialogAction=callback||null;$('#lj-dialog').showModal();icons();}
function info(title,text){dialog(title,`<p>${text}</p>`);}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function go(page){if(state.page==='strategy'&&page!=='strategy'&&dirty()){dialog('放弃未保存的修改？','<p>离开后将恢复上次保存的策略。</p>','放弃修改',()=>{state.draft={...state.saved};state.page=page;state.notice='';render();persist();});return;}state.page=page;state.notice='';render();persist();}
function home(){const a=current();return heading('配置任务，开始探索','在桌面完成配置，模拟器负责运行游戏。')+
`<div class="lj-accountstrip"><div class="lj-avatar">${icon('user-round')}</div><div class="lj-grow"><strong>${a?esc(a.name):'尚未选择账号'}</strong><small>${a?esc(a.server)+' · 需要时自动登录':'前往账号库添加示例账号'}</small></div><button class="lj-textbutton cursor-interaction" data-page="accounts">切换账号${icon('chevron-right')}</button></div><h2>任务模式</h2><div class="lj-modes">${[['auto','route','画面自动化','识别并执行操作'],['reroll','repeat-2','刷开局','寻找目标开局'],['recognize','scan-line','只读识别','识别当前画面']].map(([id,ico,t,s])=>`<button class="lj-mode cursor-interaction" data-mode="${id}" aria-pressed="${state.mode===id}" ${active()?'disabled':''}>${icon(ico)}<strong>${t}</strong><small>${s}</small></button>`).join('')}</div>`+

`<section class="lj-section"><div class="lj-sectionhead"><h2>探索配置</h2><span class="lj-badge">全局策略</span></div>${pair('评分偏好',`玩家评分 ${state.saved.playerWeight}%`)}${pair('Boss 编组',state.saved.bossTeamMode==='MULTI_TEAM'?'多队挑战':'单队挑战')}${pair('商店策略',state.saved.buyRelics?'购买遗物'+(state.saved.refreshShop?' · 第 '+state.saved.refreshFromArea+' 区域起刷新':' · 不刷新'):'不购买遗物')}<div class="lj-divider"></div><div class="lj-actions">${link('调整策略','open-strategy')}${link('开局编组','rosters')}${link('角色评分','ratings')}</div></section>`)+note('原型使用示例数据。开始、暂停与停止仅演示界面状态，不会操作游戏。');}

`<div class="lj-accountgrid"><div class="lj-accountlist">${state.accounts.map(x=>`<button class="lj-accountitem cursor-interaction" data-account="${x.id}" aria-pressed="${x.id===state.selected}"><div class="lj-avatar">${esc(x.name.slice(0,1))}</div><div class="lj-grow"><strong>${esc(x.name)}</strong><small>${esc(x.server)}${x.id===state.current?' · 当前使用':''}</small></div>${x.id===state.current?icon('check'):''}</button>`).join('')||'<div class="lj-empty">还没有账号</div>'}</div><section class="lj-section">${a?

case'boss':return `${select('挑战方式','bossTeamMode',[['MULTI_TEAM','多队挑战'],['SINGLE_TEAM','单队挑战']])}${check('优先纯伤害体系','preferPureBossDamageSystem','作为优先偏好，不强制限制编组')}${check('单队连续失败后回退多队','singleBossFallbackToMultiAfterThreeFailures')}<div class="lj-formgrid">${number('转多队前的单队重试次数','singleBossRetryCountBeforeMulti',0,10)}</div><div class="lj-divider"></div>${check('连续三次战斗失败后重新刷取','rerollAfterThreeBattleFailures')}`;
case'relic':return `<div class="lj-formgrid">${number('基线目标','baselineTarget',1,4)}${number('早期加成最后区域','baselineLastArea',0,5)}${number('减益转向最低值','debuffPivotMinimum',5,15)}${number('减益转向容差','debuffPivotTolerance',0,5)}</div><div class="lj-divider"></div>${link('编辑遗物优先级','relic-priority')}<div style="margin-top:12px">${note('未自定义排序时使用内置优先级。早期加成最后区域为 0 时关闭该加成。')}</div>`;
case'shop':return `${check('购买遗物','buyRelics','关闭后不进入商店，也不刷新商品')}${check('允许刷新商店','refreshShop','仅在购买遗物开启时生效')}<div class="lj-divider"></div>${number('从第几区域开始刷新','refreshFromArea',1,5)}<div style="margin-top:16px">${note('原版刷新消耗 300 游戏金币；此原型不会执行购买或刷新。')}</div>`;
case'events':return `<div class="lj-formgrid">${number('普通战斗预估胜率','normalWinRate',0,100,'%')}${number('极限战斗预估胜率','extremeWinRate',0,100,'%')}</div><div class="lj-divider"></div>${note('用于评估事件的预期收益，不代表实际胜率。')}`;
case'speed':return `${select('响应间隔','responseIntervalMillis',[[300,'300 ms'],[500,'500 ms']])}<div class="lj-divider"></div>${note('延续原版响应速度选项。')}`;
}}
function strategy(){return heading('策略设置','全局配置，适用于所有账号。',`<span class="lj-badge" id="lj-dirty">${dirty()?'有未保存的修改':'已保存'}</span>`)+`<div class="lj-strategygrid"><nav class="lj-categories" aria-label="策略分类">${Object.entries(categories).map(([id,t])=>`<button class="lj-category cursor-interaction" data-category="${id}" aria-pressed="${state.category===id}">${t}</button>`).join('')}<div class="lj-divider"></div>${link('开局编组','rosters')}</nav><div><form class="lj-section" id="lj-strategyform"><div class="lj-sectionhead"><h2>${categories[state.category]}</h2>${button('恢复默认','defaults')}</div>${strategyContent()}<div class="lj-divider"></div>${note('保存后，从下一次识别或自动任务开始生效；当前任务不受影响。')}<div class="lj-savebar"><span class="lj-small lj-muted">仅保存到当前原型</span><div class="lj-actions">${button('取消修改','discard')}<button class="lj-button lj-primary cursor-interaction" type="submit">保存策略</button></div></div></form></div></div>`;}
function device(){return heading('设备','管理游戏所在的模拟器，查看连接状态。')+`<section class="lj-section"><div class="lj-device">${icon('monitor')}<div class="lj-grow"><h2>MuMu 12</h2><p class="lj-small lj-muted">127.0.0.1:16384 · 示例设备</p></div><span class="lj-badge">${state.connected?'已连接':'未连接'}</span>${button(state.connected?'断开连接':'连接设备','connection',!state.connected)}</div><div class="lj-divider"></div>${pair('画面尺寸','1920 × 1080 · 横屏')}${pair('截图模式','Raw · 85 ms（示例）')}${pair('触控方式','MaaTouch')}${pair('设备画像','本地快照 · 示例')}<div class="lj-divider"></div><div class="lj-actions">${button('重新检测','detect')}${button('查看连接详情','device-detail')}</div></section><section class="lj-section"><div class="lj-sectionhead"><h2>手动连接</h2></div><label class="lj-field"><span>设备地址</span><input class="lj-input" value="127.0.0.1:16384" aria-label="设备地址"></label><div class="lj-actions" style="margin-top:14px">${button('连接该地址','manual-connect')}</div></section>`;}
function settings(){return heading('设置与环境','常用设置和运行条件集中管理。')+`<section class="lj-section"><div class="lj-sectionhead"><h2>环境检查</h2><span class="lj-badge">示例结果</span></div>${[['模拟器连接',state.connected?'就绪':'未连接'],['截图与触控',state.connected?'就绪':'等待连接'],['游戏客户端','已检测到'],['OCR 识别','就绪'],['凭据加密','DPAPI 就绪'],['数据目录','可写']].map(([t,v])=>pair(t,`<span class="${v==='未连接'?'lj-danger':'lj-green'}">${v}</span>`)).join('')}</section><section class="lj-section"><div class="lj-formgrid"><label class="lj-field"><span>网络模式</span><select data-local="网络模式"><option>跟随系统代理</option><option>直连</option></select></label><label class="lj-field"><span>关闭窗口时</span><select data-local="关闭窗口行为"><option>最小化到托盘</option><option>退出程序</option></select></label></div><div class="lj-divider"></div><div class="lj-actions">${button('更新国服数据库','database')}${button('打开数据目录','data-directory')}${button('关于','about')}</div></section>`;}
function diagnostics(){return heading('诊断','查看运行记录，在需要时定位问题。')+`<section class="lj-section"><div class="lj-sectionhead"><h2>运行诊断</h2>${icon('activity')}</div><p class="lj-small lj-muted">集中查看设备、识别和任务执行情况。</p><div class="lj-actions" style="margin-top:19px">${button('打开诊断面板','diagnostic-panel',true)}${button('导出诊断包','export-diagnostics')}</div></section><section class="lj-section"><div class="lj-sectionhead"><h2>日志与崩溃记录</h2>${button('打开日志目录','logs-folder')}</div>${pair('最近一次任务','尚未执行真实任务')}${pair('崩溃记录','暂无')}<div class="lj-divider"></div>${note('本页展示正式版本的工具入口。原型不读取本机日志或生成诊断包。')}</section>`;}
function renderLog(){$('#lj-log').innerHTML=`<div class="lj-loghead"><h2>任务日志</h2><span class="lj-badge">示例</span></div><div class="lj-logentries">${state.logs.map(([time,t])=>`<div class="lj-logline"><time>${time}</time><p>${esc(t)}</p></div>`).join('')}</div><details class="lj-preview"><summary class="cursor-interaction">画面预览</summary><div class="lj-previewbox">${icon('monitor')}<span>原型未连接游戏<br>正式版本显示最新画面</span></div></details>`;}
function renderFooter(){const a=current();$('#lj-footer').innerHTML=`<div class="lj-status" aria-live="polite"><div class="lj-statusicon">${icon(state.status==='running'?'activity':state.status==='paused'?'pause':'circle-check')}</div><div><strong>${state.status==='running'?'任务运行中':state.status==='paused'?'任务已暂停':'准备就绪'}</strong><small>${a?esc(a.name):'未选择账号'} · ${modeName()}${active()?' · 演示状态':''}</small></div></div><div class="lj-actions">${active()?(state.mode!=='reroll'?button(icon(state.status==='paused'?'play':'pause')+(state.status==='paused'?'继续':'暂停'),'pause'):'')+button(icon('square')+' 停止任务','stop'):button(icon('play')+' 开始任务','start',true)}</div>`;}
function paint(){root.style.setProperty('--lj-accent',state.accent);root.style.setProperty('--lj-soft',`color-mix(in srgb, ${state.accent} 10%, #fff)`);}
function render(){paint();root.querySelectorAll('.lj-nav').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#lj-breadcrumb').textContent=names[state.page];$('#lj-connection').innerHTML=`<span><span class="lj-dot ${state.connected?'':'lj-off'}"></span>${state.connected?'MuMu 12 · 已连接':'设备未连接'}</span>${icon('chevron-down')}`;$('#lj-main').innerHTML=({home,accounts,strategy,device,settings,diagnostics}[state.page])();$('#lj-body').classList.toggle('lj-wide',state.page!=='home');$('#lj-log').style.display=state.page==='home'?'':'none';renderLog();renderFooter();announce(state.notice);icons();}
function start(){if(!current()){go('accounts');announce('先添加并选择一个示例账号。');return;}if(!state.connected){dialog('请先连接模拟器','<p>连接后才可启动任务。此处只演示连接状态。</p>','前往设备页',()=>go('device'));return;}const run=()=>{state.status='running';addLog('开始'+modeName()+'（演示）');addLog(state.mode==='recognize'?'只读识别已启动，等待下一帧':'已载入配置，正在识别当前画面');render();};if(state.mode==='reroll'&&state.retire){dialog('允许彻底撤退当前开局？','<p>正式运行可能放弃当前开局的进度和未领取奖励。只撤退已确认不符合目标的开局；状态不明确时停止。</p>','确认开始',run);}else run();}
const messages={rosters:['开局编组','这里进入各公会的候选角色编组与顺序设置。本轮先确定主要页面布局，编组详情将沿用同一套样式。'],ratings:['角色评分','这里进入原版角色评分功能。本轮保留入口，评分详情在后续页面中展开。'],'relic-priority':['遗物优先级','这里调整遗物的优先顺序。当前演示使用内置优先级。'],detect:['重新检测','已保留设备检测入口。原型不会扫描本机设备。'],'device-detail':['连接详情','正式版本在这里显示 ADB 来源、截图测速和触控状态，并提供相关设置。'],'manual-connect':['手动连接','此原型不会连接输入的地址；可通过上方按钮切换示例连接状态。'],database:['国服数据库','正式版本在这里执行数据库更新并显示结果。'],about:['黎明界助手','Windows 桌面界面原型 · 功能与行为以原版助手为基准。'],'data-directory':['数据目录','正式版本打开本机数据目录。'],'diagnostic-panel':['诊断面板','正式版本在浏览器中打开本机诊断面板。'],'export-diagnostics':['导出诊断包','正式版本由用户选择保存位置，并生成诊断包。'],'logs-folder':['日志目录','正式版本打开日志和最近的崩溃记录。']};
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.mode){state.mode=b.dataset.mode;render();return;}if(b.dataset.category){state.category=b.dataset.category;render();persist();return;}if(b.dataset.account){state.selected=Number(b.dataset.account);render();return;}
const a=b.dataset.action;if(a==='dialog-cancel'){$('#lj-dialog').close();dialogAction=null;return;}if(a==='dialog-confirm'){const cb=dialogAction;$('#lj-dialog').close();dialogAction=null;cb?.();return;}if(messages[a]){info(...messages[a]);return;}
switch(a){case'open-strategy':go('strategy');break;case'start':start();break;case'pause':state.status=state.status==='paused'?'running':'paused';addLog(state.status==='paused'?'任务已暂停（演示）':'任务已继续（演示）');render();break;case'stop':state.status='idle';addLog('任务已停止（演示）');render();break;
case'use-account':state.current=state.selected;render();announce('已切换当前账号；需要时自动登录。');break;
case'delete-account':{const item=state.accounts.find(x=>x.id===state.selected);if(!item)break;dialog('删除这个账号？',`<p>将从原型中移除「${esc(item.name)}」。</p>`,'删除账号',()=>{state.accounts=state.accounts.filter(x=>x.id!==item.id);state.selected=state.accounts[0]?.id||null;if(state.current===item.id)state.current=state.selected;render();announce('示例账号已删除。');});break;}
case'add-account':dialog('新增示例账号','<label class="lj-field"><span>账号别名</span><input id="lj-newalias" class="lj-input" maxlength="20" value="新账号"></label><p style="margin-top:12px">仅创建原型示例，不接收真实登录凭据。</p>','添加',()=>{const name=$('#lj-newalias').value.trim()||'新账号';const id=Math.max(0,...state.accounts.map(x=>x.id))+1;state.accounts.push({id,name,server:'B 服',login:'demo_'+id});state.selected=id;if(!state.current)state.current=id;render();announce('示例账号已添加。');});break;
case'defaults':dialog('恢复默认策略？','<p>会覆盖当前草稿；点击「保存策略」后生效。</p>','恢复默认',()=>{state.draft={...defaults};render();announce('已恢复默认草稿，请保存策略。');});break;
case'discard':if(dirty())dialog('取消本次修改？','<p>恢复上次保存的策略。</p>','取消修改',()=>{state.draft={...state.saved};render();announce('已恢复上次保存的策略。');});else announce('没有未保存的修改。');break;
case'connection':{const change=()=>{state.connected=!state.connected;if(!state.connected)state.status='idle';addLog(state.connected?'设备已连接（演示）':'设备已断开（演示）');render();};if(active())dialog('停止任务并断开连接？','<p>当前演示任务会停止。</p>','停止并断开',change);else change();break;}
}});
root.addEventListener('input',e=>{const el=e.target,k=el.dataset.setting;if(k){state.draft[k]=el.type==='checkbox'?el.checked:(el.tagName==='SELECT'&&k==='bossTeamMode'?el.value:Number(el.value));if(k==='playerWeight')$('#lj-rangevalue').textContent=el.value+'%';if($('#lj-dirty'))$('#lj-dirty').textContent=dirty()?'有未保存的修改':'已保存';}if(el.dataset.task)state[el.dataset.task]=el.checked;});
root.addEventListener('change',e=>{if(e.target.dataset.local)announce('已在原型中选择：'+e.target.value+'。');});
