name: Upstream Android Compatibility
run-name: Upstream Android compatibility · ${{ github.ref_name }}

# The product shipped by this repository is Windows desktop, not the upstream APK.
on:
  push:
    branches: [main]
    paths: &android-paths
      - 'android/**'
      - '!android/**/*.md'
      - 'tools/gradle/**'
      - '.gitattributes'
      - '.github/workflows/android-ci.yml'
      - '.github/scripts/ci-summary.py'
  pull_request:
    paths: *android-paths
  workflow_dispatch:
    inputs:
      upload_reports:
        description: 'Upload compatibility reports (no APK; requires artifact storage)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Upstream Android build compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify preserved Android project
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --continue --build-cache --no-daemon --max-workers=2 --stacktrace --console=plain
      - name: Summarize upstream compatibility
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci-summary.py --client 'Upstream Android compatibility (not a desktop release)' --root android
      - name: Upload compatibility reports on request
        if: ${{ !cancelled() && inputs.upload_reports == true }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-android-compatibility-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 9
          path: |
            android/app/build/reports/
            android/app/build/test-results/
