name: Desktop CI

on:
  push:
    branches: ['desktop/**']
    paths: ['desktop/**', 'android/app/src/**', 'android/app/build.gradle.kts', 'android/app/schemas/**', 'docs/desktop/**', 'README-desktop.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', 'android/app/src/**', 'android/app/build.gradle.kts', 'android/app/schemas/**', 'docs/desktop/**', 'README-desktop.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JVM modules and OCR acceptance
        run: bash desktop/gradlew -p desktop check
      - name: Confirm upstream fixtures remain unchanged
        if: always()
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- android/)"
          if [ -n "$changes" ]; then printf '%s\n' "$changes"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-jvm-reports
          path: |
            desktop/**/build/reports/
            desktop/**/build/test-results/

  android-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify upstream Android project
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/app-debug.apk

  windows-package:
    needs: jvm-test
    runs-on: windows-latest
    steps:
      - name: Preserve LF before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Windows behavior and package
        shell: pwsh
        run: desktop/gradlew.bat -p desktop check :app:packagePortableZip
      - name: Verify portable image from Chinese and spaced directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem desktop/app/build/dist/*.zip | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP '测试 目录'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
          $launcher = Join-Path $destination 'LimingjieAssistant/LimingjieAssistant.exe'
          $report = Join-Path $destination 'self-test.json'
          $testData = Join-Path $destination 'data'
          $arguments = @('--self-test', '--report', ('"' + $report + '"'), '--data-dir', ('"' + $testData + '"'))
          $process = Start-Process -FilePath $launcher -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($process.ExitCode -ne 0) { throw "Portable self-test failed: $($process.ExitCode)" }
      - name: Confirm upstream fixtures remain unchanged
        if: always()
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all -- android/
          if ($changes) { Write-Output $changes; throw 'Upstream fixtures changed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LimingjieAssistant-windows
          path: |
            desktop/app/build/dist/
            ${{ runner.temp }}/测试 目录/self-test.json
            desktop/**/build/reports/
            desktop/**/build/test-results/
