name: Windows Desktop CI
run-name: Windows desktop · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  push:
    branches: [main]
    tags: ['v*', 'desktop-v*']
    paths: &desktop-paths
      - 'desktop/**'
      - '!desktop/**/*.md'
      - 'desktop/licenses/**'
      - 'desktop/device/licenses/**'
      - 'desktop/ocr/licenses/**'
      - 'desktop/ocr/MODELS.md'
      - 'docs/USER-GUIDE.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.gitattributes'
      - '.github/workflows/desktop-ci.yml'
      - '.github/scripts/ci-summary.py'
  pull_request:
    paths: *desktop-paths
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Include UI, integration and OCR checks, plus runtime tests when packaging'
        type: boolean
        default: false
      package_candidate:
        description: 'Build and upload a Windows candidate ZIP after selected checks pass'
        type: boolean
        default: false
      upload_reports:
        description: 'Upload detailed reports (requires available artifact storage)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 verification
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve verified resource bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Read desktop client version
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $source = Get-Content -Raw -Encoding UTF8 desktop/build.gradle.kts
          $match = [regex]::Match($source, 'version\s*=\s*"(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)"')
          if (-not $match.Success) { throw 'Desktop version is missing from desktop/build.gradle.kts' }
          $version = $match.Groups[1].Value
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -notin @("v$version", "desktop-v$version")) {
            throw "Release tag must match v$version or desktop-v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=LimingjieAssistant-desktop-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Fetch the battle model bundle for packaging
        id: model
        if: inputs.package_candidate == true || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          MODEL_URL: ${{ vars.LIMINGJIE_NN_BUNDLE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MODEL_URL) { throw 'Set LIMINGJIE_NN_BUNDLE_URL to the battle model ZIP URL' }
          $archive = Join-Path $env:RUNNER_TEMP 'battle-model.zip'
          $bundle = Join-Path $env:RUNNER_TEMP 'battle-model'
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $bundle
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
      - name: Run selected checks and build requested ZIP
        env:
          FULL_CHECKS: ${{ inputs.full_checks }}
          BUILD_PACKAGE: ${{ inputs.package_candidate == true || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') }}
          MODEL_BUNDLE: ${{ steps.model.outputs.bundle }}
        run: |
          $tasks = @('check')
          if ($env:FULL_CHECKS -eq 'true') { $tasks += @('-Pfull', '-PincludeOcrEval') }
          if ($env:BUILD_PACKAGE -eq 'true') {
            $tasks += @(':app:packagePortableZip', "-PlimingjieNnBundleDir=$env:MODEL_BUNDLE")
            if ($env:FULL_CHECKS -eq 'true') { $tasks += '-PincludePackagedRuntime' }
          }
          & desktop/gradlew.bat -p desktop @tasks --build-cache --no-daemon --max-workers=2 --stacktrace --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Desktop checks or packaging failed; see the step log and summary' }
      - name: Portable runtime self-test on request
        if: inputs.full_checks == true && (inputs.package_candidate == true || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v'))
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive }}
          DESKTOP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path 'desktop/app/build/dist' $env:ARCHIVE_NAME
          $destination = Join-Path $env:RUNNER_TEMP '桌面验证 目录'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $launcher = Join-Path $destination 'LimingjieAssistant/LimingjieAssistant.exe'
          $report = Join-Path $destination 'self-test.json'
          $testData = Join-Path $destination '独立 自检数据'
          $arguments = @('--self-test', '--report', ('"' + $report + '"'), '--data-dir', ('"' + $testData + '"'))
          $process = Start-Process -FilePath $launcher -ArgumentList $arguments -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Portable self-test timed out' }
          if ($process.ExitCode -ne 0) { throw "Portable self-test failed: $($process.ExitCode)" }
          $result = Get-Content -LiteralPath $report -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $result.passed -or $result.version -ne $env:DESKTOP_VERSION) { throw 'Portable self-test failed or desktop version differs' }
      - name: Summarize desktop results
        if: ${{ !cancelled() }}
        env:
          DESKTOP_VERSION: ${{ steps.metadata.outputs.version }}
        run: python .github/scripts/ci-summary.py --client 'Windows desktop x64' --version "$env:DESKTOP_VERSION" --root desktop --self-test "$env:RUNNER_TEMP/桌面验证 目录/self-test.json"
      - name: Upload desktop reports on request
        if: ${{ !cancelled() && inputs.upload_reports == true }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reports-${{ steps.metadata.outputs.version }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 9
          path: |
            desktop/**/build/reports/
            desktop/**/build/test-results/
            ${{ runner.temp }}/桌面验证 目录/self-test.json
      - name: Upload Windows candidate
        if: success() && (inputs.package_candidate == true || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v'))
        uses: actions/upload-artifact@v4
        with:
          name: LimingjieAssistant-desktop-${{ steps.metadata.outputs.version }}-win-x64
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: |
            desktop/app/build/dist/${{ steps.metadata.outputs.archive }}
            desktop/app/build/dist/${{ steps.metadata.outputs.archive }}.sha256
